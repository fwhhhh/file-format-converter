name: release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt
      - name: Download FFmpeg and OCR data
        run: python scripts/download_deps.py
      - name: Run tests
        env:
          QT_QPA_PLATFORM: offscreen
        run: python -m pytest -q
      - name: Build slim package
        run: python scripts/build.py
      - name: Package archive
        shell: pwsh
        run: |
          python -c "import os, shutil; tag=os.environ['GITHUB_REF_NAME']; shutil.make_archive(f'dist/FileFormatConverter-{tag}-win64', 'zip', root_dir='dist', base_dir='FileFormatConverter')"
      - name: Write checksums
        shell: pwsh
        run: |
          $lines = Get-ChildItem dist -File | Where-Object { $_.Name -match '\.(zip|exe)$' } | ForEach-Object {
            $hash = (Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLower()
            "$hash  $($_.Name)"
          }
          [System.IO.File]::WriteAllText("dist/SHA256SUMS.txt", ($lines -join "`n") + "`n")
      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/FileFormatConverter-*-win64.zip
            dist/SHA256SUMS.txt
